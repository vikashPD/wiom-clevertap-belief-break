<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wiom Belief Break – Analytics Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#FAF9FC;color:#161021;min-height:100vh}
.header{background:#D9008D;color:#fff;padding:24px 20px}
.header h1{font-size:22px;font-weight:700}
.header p{font-size:13px;opacity:.8;margin-top:4px}
.config{background:#fff;border-bottom:1px solid #E8E4F0;padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.config input{flex:1;min-width:200px;padding:10px 14px;border:1.5px solid #E8E4F0;border-radius:8px;font-size:14px;outline:none}
.config input:focus{border-color:#D9008D}
.config button{background:#D9008D;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
.config button:hover{background:#B3006F}
.banner{padding:10px 20px;font-size:13px;font-weight:600;text-align:center;background:#D4EDDA;color:#155724}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px}
.stat{background:#fff;border-radius:12px;padding:16px;border:1px solid #E8E4F0;text-align:center}
.stat .val{font-size:28px;font-weight:700;color:#D9008D}
.stat .lbl{font-size:12px;color:#5C5570;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:0 20px 20px}
.card{background:#fff;border-radius:12px;border:1px solid #E8E4F0;overflow:hidden}
.card-head{background:#FFE5F6;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-head h3{font-size:15px;font-weight:700;color:#D9008D}
.card-head .tag{font-size:10px;background:#D9008D;color:#fff;padding:2px 8px;border-radius:20px;white-space:nowrap}
.card-body{padding:16px}
.metric{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F3F1F7}
.metric:last-child{border-bottom:none}
.metric .k{font-size:13px;color:#5C5570}
.metric .v{font-size:15px;font-weight:600}
.metric .v.green{color:#008043}
.metric .v.red{color:#D92130}
.bar-wrap{height:6px;background:#F3F1F7;border-radius:3px;margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:#008043;transition:width .5s}
.footer{text-align:center;padding:20px;font-size:12px;color:#A7A1B2}
#status{font-size:12px;color:#5C5570;padding:4px 20px}
.refresh label{cursor:pointer;font-size:12px;color:#5C5570}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Wiom Belief Break Analytics</h1>
    <p>Quiz tracking dashboard for in-app campaigns</p>
  </div>
</div>

<div class="banner live" id="bannerLive">Connected to live tracking data</div>

<div class="config" id="liveConfig">
  <input type="text" id="endpoint" placeholder="Google Apps Script URL"/>
  <button onclick="loadLiveData()">Reload</button>
  <div class="refresh">
    <label><input type="checkbox" id="autoRefresh" onchange="toggleRefresh()"/> Auto 30s</label>
  </div>
</div>
<div id="status"></div>

<div class="totals" id="totals"></div>
<div class="grid" id="grid"></div>

<h2 id="bonusTitle" style="display:none;font-size:16px;font-weight:700;color:#D9008D;padding:8px 20px 0">Bonus Video Quiz &mdash; Seva Sthiti</h2>
<div class="grid" id="bonusGrid"></div>

<div class="footer">Wiom Belief Break Tracker</div>

<script>
var FLOW_INFO = {
  A1: { name: 'A1 \u2013 Carry Fee',            desc: '\u20B92/day deduction' },
  A2: { name: 'A2 \u2013 Withdrawal Rules',      desc: 'Tue & Fri withdrawal' },
  A3: { name: 'A3 \u2013 Connection Activation', desc: 'PayG \u20B9300' },
  A4: { name: 'A4 \u2013 Pickup Completion',     desc: 'NetBox \u20B950' },
  A5: { name: 'A5 \u2013 Quality Score',         desc: 'Bonus & work' }
};

var DEFAULT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw770KNFn3SnpKbRwtLbPe8MJu8dpDXwau6UY-JTfcbA8Y0T2ZRyoGRRMhi4k8WTAo2/exec';
var refreshTimer = null;

window.onload = function() {
  var saved = localStorage.getItem('wiom_tracking_url') || DEFAULT_ENDPOINT;
  document.getElementById('endpoint').value = saved;
  renderDashboard({ summary: {}, total: 0 });
  loadLiveData();
};

function loadLiveData() {
  var url = document.getElementById('endpoint').value.trim();
  if (!url) { document.getElementById('status').textContent = 'Please paste the tracking URL first'; return; }
  localStorage.setItem('wiom_tracking_url', url);
  document.getElementById('status').textContent = 'Loading\u2026';

  var cbName = '_wcb' + Date.now();
  var s = document.createElement('script');

  window[cbName] = function(data) {
    document.getElementById('bannerLive').className = 'banner live';
    renderDashboard(data);
    delete window[cbName];
    if (s.parentNode) s.parentNode.removeChild(s);
  };

  s.src = url + '?action=data&callback=' + cbName;
  s.onerror = function() {
    delete window[cbName];
    if (s.parentNode) s.parentNode.removeChild(s);
    fetch(url + '?action=data')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('bannerLive').className = 'banner live';
        renderDashboard(data);
      })
      .catch(function(err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
      });
  };
  document.body.appendChild(s);
}

function renderDashboard(data) {
  if (!data || !data.summary) {
    document.getElementById('status').textContent = 'Invalid response';
    return;
  }

  var sm = data.summary;
  var tI=0, tQ=0, tC=0, tW=0;
  var flows = ['A1','A2','A3','A4','A5'];

  for (var i=0; i<flows.length; i++) {
    var f = sm[flows[i]] || {inform:0,quiz:0,correct:0,wrong:0};
    tI+=f.inform; tQ+=f.quiz; tC+=f.correct; tW+=f.wrong;
  }

  var tA=tC+tW;
  var cR = tA>0 ? Math.round(tC/tA*100) : 0;
  var qR = tI>0 ? Math.round(tQ/tI*100) : 0;

  document.getElementById('totals').innerHTML =
    st(tI,'Total Impressions') + st(tQ,'Quiz Attempts') +
    st(tC,'Correct Answers') + st(tW,'Wrong Answers') +
    st(qR+'%','Quiz Rate') + st(cR+'%','Correct Rate');

  var html='';
  for (var j=0; j<flows.length; j++) {
    var fk=flows[j];
    var fd = sm[fk] || {inform:0,quiz:0,correct:0,wrong:0};
    var info = FLOW_INFO[fk];
    var at=fd.correct+fd.wrong;
    var cr = at>0 ? Math.round(fd.correct/at*100) : 0;
    var qr = fd.inform>0 ? Math.round(fd.quiz/fd.inform*100) : 0;

    html += '<div class="card">'+
      '<div class="card-head"><h3>'+info.name+'</h3><span class="tag">'+info.desc+'</span></div>'+
      '<div class="card-body">'+
      rw('Impressions',fd.inform,'')+
      rw('Quiz Attempts',fd.quiz,'')+
      rw('Correct',fd.correct,'green')+
      rw('Wrong',fd.wrong,'red')+
      rw('Quiz Rate',qr+'%','')+
      rw('Correct Rate',cr+'%',cr>=50?'green':'red')+
      '<div class="bar-wrap"><div class="bar-fill" style="width:'+cr+'%"></div></div>'+
      '</div></div>';
  }

  document.getElementById('grid').innerHTML = html;

  // ---- Bonus Video Quiz section (flow = BONUS) ----
  var b = sm.BONUS || {inform:0,quiz:0,correct:0,wrong:0};
  var bA = b.correct + b.wrong;
  var bcr = bA>0 ? Math.round(b.correct/bA*100) : 0;
  var bqr = b.inform>0 ? Math.round(b.quiz/b.inform*100) : 0;
  document.getElementById('bonusTitle').style.display = 'block';
  document.getElementById('bonusGrid').innerHTML =
    '<div class="card">'+
    '<div class="card-head"><h3>Seva Sthiti Video Quiz</h3><span class="tag">FUNNEL</span></div>'+
    '<div class="card-body">'+
    rw('Impressions',b.inform,'')+
    rw('Reached Quiz (after 45s)',b.quiz,'')+
    rw('Correct',b.correct,'green')+
    rw('Wrong',b.wrong,'red')+
    rw('Reach Rate',bqr+'%','')+
    rw('Correct Rate',bcr+'%',bcr>=50?'green':'red')+
    '<div class="bar-wrap"><div class="bar-fill" style="width:'+bcr+'%"></div></div>'+
    '</div></div>';

  document.getElementById('status').textContent =
    'Updated: '+new Date().toLocaleTimeString()+' | Events: '+(data.total||0);
}

function st(v,l) {
  return '<div class="stat"><div class="val">'+v+'</div><div class="lbl">'+l+'</div></div>';
}
function rw(k,v,c) {
  return '<div class="metric"><span class="k">'+k+'</span><span class="v'+(c?' '+c:'')+'">'+v+'</span></div>';
}
function toggleRefresh() {
  if (document.getElementById('autoRefresh').checked) {
    refreshTimer = setInterval(loadLiveData, 30000);
  } else {
    clearInterval(refreshTimer); refreshTimer=null;
  }
}
</script>
</body>
</html>
